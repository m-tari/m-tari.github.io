name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Path to check (e.g. blog/ or empty for home)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Get Chromium version 🌐
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV

      - name: Setup Chrome 🌐
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}

      - name: Install chromedriver 🚗
        run: npm install -g chromedriver@$CHROMIUM_VERSION

      - name: Run axe 🪓
        run: |
          npm install -g @axe-core/cli http-server
          http-server _site/ -p 8080 &
          sleep 2
          axe --chromedriver-path "$(npm root -g)/chromedriver/bin/chromedriver" \
            "http://localhost:8080/${{ github.event.inputs.url }}" \
            --load-delay=1500 \
            --exit
