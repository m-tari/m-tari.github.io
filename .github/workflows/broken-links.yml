name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_news/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "**/*.md"
      - "**.yml"
      - ".lycheeignore"
      - ".github/workflows/broken-links.yml"
      - "!docs/**"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_news/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "**/*.md"
      - "**.yml"
      - ".lycheeignore"
      - ".github/workflows/broken-links.yml"
      - "!docs/**"
      - "!README.md"
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # Source markdown; .lycheeignore skips unrendered Liquid and flaky externals
          args: >-
            --user-agent 'curl/7.54'
            --max-retries 3
            --retry-wait-time 2
            --exclude-path README.md
            --exclude-path docs
            --exclude-path AGENTS.md
            --exclude-path CLAUDE.md
            --exclude-path .github/instructions
            --exclude-path _pages/404.md
            --verbose
            --no-progress
            '_pages/**/*.md'
            '_posts/**/*.md'
            '_news/**/*.md'
            '_projects/**/*.md'
